<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Reviews</title></head>
<body>
  <!-- Hand-built approximation of a BunPro cloze review card. BunPro exposes
       #quiz-metadata-element specifically for third-party review tools; the
       attribute names mirror the live element (see src/bunpro.ts).
       See tests/fixtures/README.md. -->
  <div id="quiz-metadata-element"
       data-meta-loc="review"
       data-meta-is-correct="false"
       data-meta-is-post-attempt="false"
       data-meta-info='{"id":806,"type":"vocab"}'
       data-meta-input-mode="manual"
       data-meta-question-mode="cloze"
       data-meta-total-submissions-count="0"
       data-meta-answers-array='["おとこ"]'></div>

  <input id="js-manual-input" class="InputManual__input" type="text" autocomplete="off">
  <button class="InputManual__button" type="button">Submit</button>
</body>
</html>
