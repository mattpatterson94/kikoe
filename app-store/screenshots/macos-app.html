<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kikoe Mac App Store Screenshots</title>
  <!-- Mac App Store screenshots of the native Kikoe Mac app. Each shot wraps a
       real capture of the running app (source-captures/mac-app-N.png, a
       window captured with `screencapture -o -l <window id>`) in the same
       headline layout as the other store screenshots. Render with
       render-macos-app.sh. -->
  <style>
    :root {
      --bg: #fbf3e4;
      --ink: #11120f;
      --muted: #4f5149;
      --mint: #c7e6cc;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
    body { color: var(--ink); }
    .shot {
      width: 100vw;
      height: 100vh;
      padding: 56px 60px;
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 44px;
      align-items: center;
      position: relative;
      background:
        radial-gradient(circle at 93% 0%, rgba(199, 230, 204, 0.92) 0 18%, transparent 18.2%),
        radial-gradient(circle at 0% 100%, rgba(199, 230, 204, 0.58) 0 20%, transparent 20.2%),
        linear-gradient(145deg, #fff9ec 0%, #fbf3e4 62%, #eef5e9 100%);
    }
    .copy { display: grid; gap: 22px; position: relative; z-index: 1; }
    .brand { display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 850; }
    .brand img { width: 62px; height: 62px; border-radius: 16px; box-shadow: 0 12px 34px rgba(17,18,15,0.13); }
    .tag {
      width: fit-content;
      padding: 10px 16px;
      border-radius: 999px;
      border: 2px solid var(--ink);
      background: var(--mint);
      font-size: 18px;
      font-weight: 850;
    }
    h1 { margin: 0; font-size: 56px; line-height: 0.98; font-weight: 880; }
    p { margin: 0; color: var(--muted); font-size: 23px; line-height: 1.26; font-weight: 620; }
    .window { position: relative; z-index: 1; display: flex; justify-content: center; align-items: center; }
    .window img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 28px 50px rgba(17,18,15,0.28));
    }
  </style>
</head>
<body>
  <main class="shot">
    <section class="copy">
      <div class="brand"><img src="../../ios/KikoeApp/Assets.xcassets/AppIcon.appiconset/icon1024.png" alt=""><span>Kikoe</span></div>
      <div class="tag" data-field="tag"></div>
      <h1 data-field="title"></h1>
      <p data-field="subtitle"></p>
    </section>
    <section class="window"><img data-field="img" alt=""></section>
  </main>
  <script>
    const shots = {
      1: { tag: "WaniKani", title: "Speak on WaniKani", subtitle: "Say the answer and Kikoe types it in and submits it.", img: "source-captures/mac-app-1.png" },
      2: { tag: "BunPro", title: "Use it on BunPro", subtitle: "Grammar and vocab reviews by voice, in the same app.", img: "source-captures/mac-app-2.png" },
      3: { tag: "Settings", title: "Set up each app", subtitle: "Turbo, strict kanji readings, Ippatsu and the live transcript, separately for WaniKani and BunPro.", img: "source-captures/mac-app-3.png" }
    };
    const n = new URLSearchParams(location.search).get("shot") || "1";
    const s = shots[n];
    for (const el of document.querySelectorAll("[data-field]")) {
      const f = el.dataset.field;
      if (f === "img") el.src = s.img; else el.textContent = s[f];
    }
  </script>
</body>
</html>
