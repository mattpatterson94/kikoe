name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Tests, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      # The voice-command tables in README.md are generated from
      # src/commands.ts; this fails when the two have drifted apart.
      - name: README command tables
        run: npm run readme:commands:check

  # Separate job: this one needs the assembled extension, a browser, and a
  # display, none of which the checks above want to wait for.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # ~12 MB of JMdict/KANJIDIC2, fetched by build.sh and unchanged between
      # runs unless DATA_VERSION moves.
      - name: Cache dictionary data
        uses: actions/cache@v4
        with:
          path: data
          key: kikoe-dictionary-${{ hashFiles('build.sh') }}

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      # Chromium loads extensions only in a headed browser.
      - name: End-to-end specs
        run: xvfb-run -a npm run test:e2e
